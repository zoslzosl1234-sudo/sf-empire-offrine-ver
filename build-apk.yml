name: Build SF Empire Offline Test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Add SF Empire rules asset
        run: |
          mkdir -p llama.cpp/examples/llama.android/app/src/main/assets
          cp rules.txt llama.cpp/examples/llama.android/app/src/main/assets/sf_empire_rules.txt

      - name: Build official llama.cpp Android demo APK
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp llama.cpp/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk out/SF-Empire-Offline-Test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SF-Empire-Offline-Test-APK
          path: out/SF-Empire-Offline-Test.apk
          if-no-files-found: error
