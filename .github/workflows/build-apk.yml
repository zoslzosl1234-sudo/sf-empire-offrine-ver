name: Build SF Empire Offline v0.2 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Install SF Empire assets and UI
        run: |
          set -eux
          BASE=llama.cpp/examples/llama.android/app/src/main
          mkdir -p "$BASE/assets"
          cp rules.txt "$BASE/assets/sf_empire_rules.txt"
          cp core_rules.txt "$BASE/assets/sf_empire_core_rules.txt"
          cp overrides/MainActivity.kt "$BASE/java/com/example/llama/MainActivity.kt"
          cp overrides/activity_main.xml "$BASE/res/layout/activity_main.xml"
          cp overrides/item_message_assistant.xml "$BASE/res/layout/item_message_assistant.xml"
          cp overrides/item_message_user.xml "$BASE/res/layout/item_message_user.xml"
          cp overrides/bubble_assistant.xml "$BASE/res/drawable/bubble_assistant.xml"
          cp overrides/bubble_user.xml "$BASE/res/drawable/bubble_user.xml"
          cp overrides/input_background.xml "$BASE/res/drawable/input_background.xml"
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">SF Empire Offline</string>#' "$BASE/res/values/strings.xml" || true

      - name: Verify no Internet permission
        run: |
          if grep -R "android.permission.INTERNET" llama.cpp/examples/llama.android/app/src/main/AndroidManifest.xml; then
            echo "Unexpected INTERNET permission found" >&2
            exit 1
          fi

      - name: Build APK
        working-directory: llama.cpp/examples/llama.android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp llama.cpp/examples/llama.android/app/build/outputs/apk/debug/app-debug.apk out/SF-Empire-Offline-v0.2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SF-Empire-Offline-v0.2-APK
          path: out/SF-Empire-Offline-v0.2.apk
          if-no-files-found: error
